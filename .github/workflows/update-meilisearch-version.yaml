name: Update Meilisearch Version

on:
  repository_dispatch:
    types: [meilisearch-release]
  # For testing purposes
  workflow_dispatch:
    inputs:
      version:
        description: 'Meilisearch version to test (e.g., v1.25.0)'
        required: true
        type: string

jobs:
  update-version:
    name: Update Meilisearch version and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump Meilisearch version
        id: bump
        env:
          # Support both repository_dispatch (client_payload) and workflow_dispatch (inputs)
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: .github/scripts/bump-meilisearch-version.sh "$VERSION"

      - name: Create Pull Request
        if: steps.bump.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.MEILI_BOT_GH_PAT }}
          commit-message: "chore(version): bump Meilisearch to ${{ steps.bump.outputs.new_version }}"
          title: "Bump Meilisearch to ${{ steps.bump.outputs.new_version }}"
          body: |
            ## Description

            This PR updates Meilisearch to version `${{ steps.bump.outputs.new_version }}`.

            ## Changes

            - Updated `appVersion` in `Chart.yaml`
            - Bumped chart `version` (${{ steps.bump.outputs.bump_type }}) to `${{ steps.bump.outputs.chart_version }}` in `Chart.yaml`
            - Updated `image.tag` in `values.yaml`
            - Updated compatibility section in `README.md`
            - Regenerated `manifests/meilisearch.yaml`

            ## Release notes

            See the [Meilisearch ${{ steps.bump.outputs.new_version }} release notes](https://github.com/meilisearch/meilisearch/releases/tag/${{ steps.bump.outputs.new_version }}).

            If this PR gets outdated (e.g., another PR bumped the chart version first), comment `@meilisearch update-version` to rebuild it on top of `main`.

            ---
            🤖 *This PR was automatically created by the [update-meilisearch-version](.github/workflows/update-meilisearch-version.yaml) workflow.*
          branch: "bump/meilisearch-${{ steps.bump.outputs.new_version }}"
          base: main
          labels: |
            dependencies
            automated
          reviewers: brunoocasali
          delete-branch: true

